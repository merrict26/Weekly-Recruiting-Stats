name: Agency Recruiting Digest (Expanxion)
 
on:
  # Triggered via slash command
  workflow_dispatch:
    inputs:
      response_url:
        description: 'Slack response URL'
        required: true
 
jobs:
  post-digest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Run Expanxion digest
        env:
          LEVER_API_KEY: ${{ secrets.LEVER_API_KEY }}
          SLACK_WEBHOOK_URL_EXPANXION: ${{ secrets.SLACK_WEBHOOK_URL_EXPANXION }}
          SLACK_RESPONSE_URL: ${{ github.event.inputs.response_url }}
        run: |
          python expanxion_digest.py
 
          python expanxion_digest.py
