name: Agency Recruiting Digest (Expanxion)

on:
  schedule:
    # Runs every weekday at 10am PT (6pm UTC)
    - cron: '0 18 * * 1-5'
  
  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  post-digest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Run Expanxion digest
        env:
          LEVER_API_KEY: ${{ secrets.LEVER_API_KEY }}
          SLACK_WEBHOOK_URL_EXPANXION: ${{ secrets.SLACK_WEBHOOK_URL_EXPANXION }}
        run: |
          python expanxion_digest.py
