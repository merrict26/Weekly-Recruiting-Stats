name: Preview Recruiting Digest

# Manual-only. Renders the digest from LIVE Lever data and commits it to
# PREVIEW.md instead of posting to Slack. Nothing reaches #recruiting.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Render digest preview (no Slack post)
        env:
          LEVER_API_KEY: ${{ secrets.LEVER_API_KEY }}
          DRY_RUN: '1'
        run: python recruiting_digest.py

      - name: Commit PREVIEW.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PREVIEW.md
          git commit -m "Digest preview (live Lever, not posted) [skip ci]" || echo "No changes"
          git push
