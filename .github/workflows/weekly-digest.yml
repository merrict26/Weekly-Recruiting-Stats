name: Weekly Recruiting Digest

on:
  schedule:
    # Runs every Friday at 4pm PT (midnight UTC on Saturday)
    - cron: '0 0 * * 6'
  
  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  post-digest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Run recruiting digest
        env:
          LEVER_API_KEY: ${{ secrets.LEVER_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python recruiting_digest.py
